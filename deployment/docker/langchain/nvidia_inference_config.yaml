# NVIDIA Inference Configuration for LangChain MCP Server Agents
# ==============================================================

# NVIDIA TensorRT Inference Server Settings
triton_server:
  url: "localhost:8000"
  model_repository: "/models"
  grpc_port: 8001
  http_port: 8000
  metrics_port: 8002
  
# Model Configuration
models:
  # LLM Models
  llama2-7b:
    backend: "tensorrt_llm"
    max_batch_size: 16
    dynamic_batching:
      preferred_batch_size: [4, 8, 16]
      max_queue_delay_microseconds: 100
    optimization:
      gpu_memory_fraction: 0.9
      use_fp16: true
      
  mistral-7b:
    backend: "tensorrt_llm"
    max_batch_size: 16
    dynamic_batching:
      preferred_batch_size: [4, 8, 16]
      max_queue_delay_microseconds: 100
    optimization:
      gpu_memory_fraction: 0.9
      use_fp16: true
      
  # Embedding Models
  bge-large:
    backend: "onnxruntime_onnx"
    max_batch_size: 32
    optimization:
      use_fp16: true
      
# GPU Configuration
gpu:
  device_id: 0
  memory_limit: 8192  # in MB
  memory_growth: true
  per_process_gpu_memory_fraction: 0.95
  
# Optimization Settings
optimization:
  # TensorRT Settings
  tensorrt:
    workspace_size_mb: 4096
    precision_mode: "fp16"  # fp32, fp16, or int8
    max_batch_size: 16
    enable_context_fmha: true
    
  # CUDA Settings
  cuda:
    cudnn_benchmark: true
    cudnn_deterministic: false
    
# MCP Server Integration
mcp_integration:
  # Enable NVIDIA Inference for specific MCP servers
  enabled_servers:
    - "context7-mcp"
    - "enhanced-copilot-mcp"
    - "ai-integration-mcp"
    - "langchain-mcp"
    
  # Model routing for each MCP server
  server_models:
    context7-mcp:
      primary_model: "llama2-7b"
      embedding_model: "bge-large"
      
    enhanced-copilot-mcp:
      primary_model: "mistral-7b"
      embedding_model: "bge-large"
      
    ai-integration-mcp:
      primary_model: "llama2-7b"
      embedding_model: "bge-large"
      
    langchain-mcp:
      primary_model: "mistral-7b"
      embedding_model: "bge-large"
      
# Performance Monitoring
monitoring:
  enable_gpu_metrics: true
  metrics_interval_seconds: 10
  log_inference_latency: true
  
# Caching Configuration
cache:
  enable_kv_cache: true
  cache_size_gb: 8
  ttl_seconds: 3600

# Triton Inference Server Settings
triton:
  host: "localhost"
  port: 8001
  model_repository: "/models"

# Logging
logging:
  level: "INFO"
  file: "/var/log/nvidia_inference.log" 