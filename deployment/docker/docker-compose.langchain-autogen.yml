networks:
  flash-loan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  langchain_data:
    driver: local
  autogen_data:
    driver: local

services:
  # Core Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: flash-loan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flash_loan_db}
      POSTGRES_USER: ${POSTGRES_USER:-flash_loan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash_loan_secure_2025}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      flash-loan-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flash_loan_user} -d ${POSTGRES_DB:-flash_loan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: flash-loan-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-flash_loan_redis_2025} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      flash-loan-network:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # LangChain Coordinator Service
  langchain-coordinator:
    build:
      context: ./langchain
      dockerfile: Dockerfile
    container_name: flash-loan-langchain
    restart: unless-stopped
    environment:
      # Core API Keys (optional for basic functionality)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-demo_key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-demo_key}
      
      # GitHub Copilot Pro Plus Configuration
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_COPILOT_ENABLED=true
      - COPILOT_API_BASE=https://api.githubcopilot.com
      - COPILOT_MODEL=copilot-gpt-4
      - COPILOT_SUBSCRIPTION_TYPE=pro_plus
      - USE_GITHUB_COPILOT_FOR_CODE_GENERATION=true
      - USE_GITHUB_COPILOT_FOR_ANALYSIS=true
      
      # Database Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flash_loan_db}
      - POSTGRES_USER=${POSTGRES_USER:-flash_loan_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flash_loan_secure_2025}
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-flash_loan_redis_2025}
      
      # Service Configuration
      - SERVICE_NAME=langchain-coordinator
      - SERVICE_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - langchain_data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    networks:
      flash-loan-network:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # AutoGen Coordinator Service
  autogen-coordinator:
    build:
      context: ./autogen
      dockerfile: Dockerfile
    container_name: flash-loan-autogen
    restart: unless-stopped
    environment:
      # Core API Keys (optional for basic functionality)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-demo_key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-demo_key}
      
      # GitHub Copilot Pro Plus Configuration
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_COPILOT_ENABLED=true
      - COPILOT_API_BASE=https://api.githubcopilot.com
      - COPILOT_MODEL=copilot-gpt-4
      - COPILOT_SUBSCRIPTION_TYPE=pro_plus
      - USE_GITHUB_COPILOT_FOR_AGENTS=true
      - USE_GITHUB_COPILOT_FOR_CONVERSATIONS=true
      - COPILOT_MAX_TOKENS=8192
      - COPILOT_TEMPERATURE=0.1
      
      # AutoGen Configuration
      - AUTOGEN_WORK_DIR=/app/autogen_work
      - AUTOGEN_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTOGEN_MAX_AGENTS=${AUTOGEN_MAX_AGENTS:-10}
      
      # Database Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flash_loan_db}
      - POSTGRES_USER=${POSTGRES_USER:-flash_loan_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flash_loan_secure_2025}
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-flash_loan_redis_2025}
      
      # Service Configuration
      - SERVICE_NAME=autogen-coordinator
      - SERVICE_PORT=8000
      - LANGCHAIN_COORDINATOR_URL=http://langchain-coordinator:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - autogen_data:/app/data
      - autogen_data:/app/autogen_work
      - autogen_data:/app/conversation_logs
      - ./logs:/app/logs
    ports:
      - "8010:8000"
      - "8011:8001"
      - "8012:8002"
    networks:
      flash-loan-network:
        ipv4_address: 172.20.0.31
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      langchain-coordinator:
        condition: service_healthy