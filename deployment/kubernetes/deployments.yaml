# MCP Coordinator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-coordinator
  namespace: flash-loan-system
  labels:
    app: mcp-coordinator
    component: coordination
    tier: critical
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: mcp-coordinator
  template:
    metadata:
      labels:
        app: mcp-coordinator
        component: coordination
        tier: critical
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: flash-loan-service-account
      containers:
      - name: mcp-coordinator
        image: flash-loan/mcp-coordinator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: api
        - containerPort: 8080
          name: dashboard
        envFrom:
        - configMapRef:
            name: flash-loan-config
        - secretRef:
            name: flash-loan-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: config-volume
        configMap:
          name: flash-loan-config
      - name: logs-volume
        emptyDir: {}

