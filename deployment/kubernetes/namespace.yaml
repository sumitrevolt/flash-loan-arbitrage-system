apiVersion: v1
kind: Namespace
metadata:
  name: flash-loan-system
  labels:
    name: flash-loan-system
    environment: production
    version: "1.0.0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: flash-loan-quota
  namespace: flash-loan-system
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
    services: "20"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: flash-loan-limits
  namespace: flash-loan-system
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container