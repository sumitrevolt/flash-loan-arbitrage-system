global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'mcp-servers'
    static_configs:
      - targets: ['mcp-servers-pro:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'ai-agents'
    static_configs:
      - targets: ['agents-pro:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-cluster:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-db:5432']

  - job_name: 'github-metrics'
    static_configs:
      - targets: ['github-metrics:8090']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
