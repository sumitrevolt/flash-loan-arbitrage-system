global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mcp_servers'
    static_configs:
      - targets: ['mcp-servers:8000', 'mcp-servers:8001', 'mcp-servers:8002']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-cluster:6379']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-db:5432']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'influxdb'
    static_configs:
      - targets: ['influxdb:8086']
    metrics_path: '/metrics'
    scheme: 'http'