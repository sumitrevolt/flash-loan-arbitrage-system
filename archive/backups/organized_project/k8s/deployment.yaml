
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-loan-arbitrage
  labels:
    app: flash-loan-arbitrage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flash-loan-arbitrage
  template:
    metadata:
      labels:
        app: flash-loan-arbitrage
    spec:
      containers:
      - name: arbitrage-engine
        image: flash-loan-arbitrage:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flash-loan-secrets
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: flash-loan-service
spec:
  selector:
    app: flash-loan-arbitrage
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
