version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: flash_loan_arbitrage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - flash_loan_network

  # Redis for caching and message queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - flash_loan_network

  # Main application services
  mcp_coordinator:
    build:
      context: .
      dockerfile: docker/mcp_coordinator.Dockerfile
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    depends_on:
      - postgres
      - redis
    networks:
      - flash_loan_network
    ports:
      - "9000:9000"

  price_feed_server:
    build:
      context: .
      dockerfile: docker/price_feed.Dockerfile
    environment:
      - MCP_COORDINATOR_URL=http://mcp_coordinator:9000
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    depends_on:
      - mcp_coordinator
    networks:
      - flash_loan_network
    ports:
      - "9001:9001"

  arbitrage_engine:
    build:
      context: .
      dockerfile: docker/arbitrage_engine.Dockerfile
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - TRADING_MODE=${TRADING_MODE:-simulation}
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    depends_on:
      - postgres
      - redis
      - price_feed_server
    networks:
      - flash_loan_network

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      - DB_HOST=postgres
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    depends_on:
      - postgres
    networks:
      - flash_loan_network
    ports:
      - "8000:8000"

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - flash_loan_network

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - flash_loan_network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  flash_loan_network:
    driver: bridge
