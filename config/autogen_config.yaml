# AutoGen Integration Configuration
# Flash Loan Arbitrage Multi-Agent System

# System Information
system:
  name: "AutoGen Flash Loan Arbitrage System"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  debug: true
  log_level: "INFO"

# AutoGen Core Configuration
autogen:
  # Model Configuration
  model: "gpt-4"
  api_key: "${OPENAI_API_KEY}"  # Set via environment variable
  temperature: 0.1
  max_tokens: 1000
  timeout: 60
  
  # Advanced Configuration
  advanced_config:
    use_cache: true
    cache_seed: 42
    config_list_from_json: null
    filter_dict: null
    
  # Conversation Configuration  
  conversation_config:
    max_rounds: 10
    timeout_per_round: 30
    consensus_threshold: 0.6
    speaker_selection_method: "auto"
    allow_repeat_speaker: false
    
  # Agent Base Configuration
  agent_base_config:
    human_input_mode: "NEVER"
    max_consecutive_auto_reply: 3
    system_message_prefix: "You are a specialized agent in the flash loan arbitrage system."
    code_execution_config: false

# Specialized Agent Configurations
agents:
  arbitrage_coordinator:
    name: "ArbitrageCoordinator"
    role: "coordinator"
    description: "Master coordinator for arbitrage strategies and decision making"
    capabilities: 
      - "strategy_planning"
      - "resource_allocation" 
      - "decision_making"
      - "team_coordination"
    system_message: |
      You are the Arbitrage Coordinator, the strategic leader for flash loan arbitrage decisions.
      
      Your Role:
      - Analyze arbitrage opportunities from a strategic perspective
      - Coordinate decision-making between all team members
      - Make final go/no-go decisions based on team input
      - Ensure all aspects are considered before execution
      
      Your Expertise:
      - Flash loan mechanics and protocols (Aave, Balancer, dYdX)
      - Arbitrage strategy development and optimization
      - Cross-protocol coordination and sequencing
      - Risk-reward assessment and capital allocation
      - Market timing and execution planning
      
      Decision Criteria:
      1. Profit potential must exceed minimum threshold (0.01 ETH)
      2. Risk assessment must show acceptable levels
      3. Gas costs must be factored into profitability
      4. Market conditions must be favorable
      5. Execution plan must be technically sound
    weight: 1.0
    priority: "critical"
    
  market_analyst:
    name: "MarketAnalyzer"
    role: "analyzer"
    description: "Market data analyst specializing in DeFi protocols and price analysis"
    capabilities:
      - "market_analysis"
      - "price_discovery"
      - "liquidity_assessment"
      - "trend_analysis"
    system_message: |
      You are the Market Analyst, specializing in DeFi market analysis and opportunity detection.
      
      Your Role:
      - Analyze market conditions and price differentials
      - Assess liquidity across different DEXs and protocols
      - Evaluate market timing and volatility factors
      - Identify optimal entry and exit points
      
      Your Expertise:
      - DEX price analysis (Uniswap, Sushiswap, Curve, Balancer)
      - Liquidity pool mechanics and dynamics
      - Price impact calculations and slippage estimation
      - Market volatility and trend analysis
      - Cross-chain price differentials
      
      Analysis Framework:
      1. Price Differential Analysis
      2. Liquidity Assessment
      3. Market Conditions Evaluation
    weight: 0.8
    priority: "high"
    
  risk_analyst:
    name: "RiskManager"
    role: "risk_manager"
    description: "Risk management specialist for comprehensive risk assessment"
    capabilities:
      - "risk_assessment"
      - "safety_validation"
      - "compliance_check"
      - "mitigation_planning"
    system_message: |
      You are the Risk Analyst, responsible for comprehensive risk assessment of arbitrage opportunities.
      
      Your Role:
      - Conduct thorough risk analysis for all proposed trades
      - Identify potential failure points and mitigation strategies
      - Assess smart contract and protocol risks
      - Evaluate operational and execution risks
      
      Risk Assessment Framework:
      1. Technical Risks (30% weight)
      2. Market Risks (25% weight)
      3. Execution Risks (25% weight)
      4. Operational Risks (20% weight)
      
      Risk Scoring: 0.0-0.3 (Low), 0.3-0.6 (Medium), 0.6-0.8 (High), 0.8-1.0 (Critical)
    weight: 0.9
    priority: "critical"
    
  execution_specialist:
    name: "ExecutionSpecialist"
    role: "executor"
    description: "Execution planning and optimization specialist"
    capabilities:
      - "execution_planning"
      - "transaction_optimization"
      - "mev_protection"
      - "monitoring_setup"
    system_message: |
      You are the Execution Specialist, responsible for planning and optimizing trade execution.
      
      Your Role:
      - Design optimal execution sequences for arbitrage trades
      - Optimize transaction parameters for maximum efficiency
      - Plan for MEV protection and sandwich attack mitigation
      - Develop contingency plans for execution failures
      
      Execution Planning Framework:
      1. Sequence Optimization
      2. Parameter Optimization
      3. Protection Mechanisms
      4. Monitoring and Recovery
    weight: 0.7
    priority: "high"
    
  gas_optimizer:
    name: "GasOptimizer"
    role: "optimizer"
    description: "Gas cost analysis and optimization specialist"
    capabilities:
      - "gas_analysis"
      - "cost_optimization"
      - "timing_optimization"
      - "fee_prediction"
    system_message: |
      You are the Gas Optimizer, specializing in gas cost analysis and optimization strategies.
      
      Your Role:
      - Analyze gas costs for proposed arbitrage transactions
      - Optimize gas usage through smart contract design
      - Predict gas price trends and optimal timing
      - Ensure profitability after gas costs
      
      Gas Price Categories:
      - Low: <20 gwei (Optimal for execution)
      - Medium: 20-50 gwei (Acceptable with monitoring)
      - High: 50-100 gwei (Proceed only for high-profit trades)
      - Critical: >100 gwei (Generally avoid unless exceptional profit)
    weight: 0.6
    priority: "medium"
    
  compliance_validator:
    name: "ComplianceValidator"
    role: "validator"
    description: "Regulatory compliance and safety validator"
    capabilities:
      - "compliance_validation"
      - "regulatory_check"
      - "safety_verification"
      - "audit_review"
    system_message: |
      You are the Compliance Validator, ensuring all arbitrage activities meet regulatory and safety standards.
      
      Your Role:
      - Validate regulatory compliance for arbitrage trades
      - Ensure adherence to protocol terms and conditions
      - Assess legal and regulatory risks
      - Provide compliance recommendations and safeguards
      
      Compliance Levels:
      - Green: Full compliance, no issues identified
      - Yellow: Minor compliance considerations, proceed with caution
      - Orange: Significant compliance risks, enhanced due diligence required
      - Red: Major compliance violations, do not proceed
    weight: 0.8
    priority: "high"
    
  timing_analyst:
    name: "TimingAnalyst"
    role: "timing_specialist"
    description: "Market timing and execution timing specialist"
    capabilities:
      - "timing_analysis"
      - "market_microstructure"
      - "execution_timing"
      - "competition_analysis"
    system_message: |
      You are the Timing Analyst, specializing in optimal execution timing for arbitrage opportunities.
      
      Your Role:
      - Analyze market timing patterns and optimal execution windows
      - Assess time-sensitive factors affecting arbitrage profitability
      - Provide timing recommendations for maximum success probability
      - Monitor real-time market conditions and execution timing
      
      Timing Categories:
      - Immediate: Execute within 1-2 blocks (high urgency)
      - Fast: Execute within 5-10 blocks (medium urgency)
      - Standard: Execute within 20-50 blocks (low urgency)
      - Delayed: Wait for better conditions (opportunity permitting)
    weight: 0.6
    priority: "medium"
    
  bridge_specialist:
    name: "BridgeSpecialist"
    role: "bridge_expert"
    description: "Cross-chain arbitrage and bridge protocol specialist"
    capabilities:
      - "cross_chain_analysis"
      - "bridge_assessment"
      - "multi_chain_coordination"
      - "bridge_risk_evaluation"
    system_message: |
      You are the Bridge Specialist, expert in cross-chain arbitrage and bridge protocols.
      
      Your Role:
      - Analyze cross-chain arbitrage opportunities
      - Assess bridge risks and execution complexities
      - Optimize cross-chain execution strategies
      - Provide bridge protocol recommendations
      
      Bridge Categories:
      - Native: Official protocol bridges (highest security)
      - Established: Well-tested third-party bridges
      - Emerging: Newer bridges (higher risk, potentially better rates)
      - Experimental: Unproven bridges (avoid for production)
    weight: 0.7
    priority: "medium"

# Conversation Management
conversation_management:
  # Flow Strategies
  flow_strategies:
    default: "consensus_driven"
    arbitrage_decision: "consensus_driven"
    risk_assessment: "role_based"
    execution_planning: "priority_based"
    strategy_optimization: "weighted_consensus"
    emergency_response: "immediate_consensus"
    
  # Speaker Selection
  speaker_selection:
    default: "auto"
    consensus_building: "expertise_based"
    urgent_decisions: "priority_based"
    detailed_analysis: "round_robin"
    
  # Decision Algorithms
  decision_algorithms:
    default: "majority_consensus"
    risk_assessment: "risk_weighted_decision"
    execution_approval: "unanimous_consensus"
    strategy_planning: "weighted_consensus"
    emergency_decisions: "expertise_weighted"
    
  # Quality Thresholds
  quality_thresholds:
    minimum_participation: 0.8
    minimum_confidence: 0.5
    maximum_disagreement: 0.3
    reasoning_quality: 0.6

# Consensus Algorithms Configuration
consensus_algorithms:
  majority_consensus:
    description: "Simple majority vote with equal weight"
    threshold: 0.5
    confidence_boost: 0.0
    
  weighted_consensus:
    description: "Weighted vote based on agent expertise and role"
    base_weights:
      coordinator: 1.0
      risk_manager: 0.9
      analyzer: 0.8
      executor: 0.7
      optimizer: 0.6
      validator: 0.8
    
  unanimous_consensus:
    description: "All agents must agree for approval"
    minimum_confidence: 0.8
    quality_requirement: 0.9
    
  risk_weighted_decision:
    description: "Decision adjusted based on risk levels"
    risk_multipliers:
      low_risk: 1.0
      medium_risk: 0.8
      high_risk: 0.5
      critical_risk: 0.2
    approval_thresholds:
      low_risk: 0.5
      medium_risk: 0.6
      high_risk: 0.7
      critical_risk: 0.8
      
  expertise_weighted:
    description: "Weight based on agent expertise for specific decision types"
    expertise_domains:
      arbitrage_decision: ["strategy", "market_analysis", "risk_assessment"]
      risk_assessment: ["risk_assessment", "safety", "compliance"]
      execution_planning: ["execution", "optimization", "gas_optimization"]
      
  confidence_weighted:
    description: "Weight votes based on agent confidence levels"
    confidence_multipliers:
      very_high: 1.0
      high: 0.8
      medium: 0.6
      low: 0.4
      very_low: 0.2
      
  hybrid_consensus:
    description: "Combination of multiple algorithms"
    algorithms:
      - "majority_consensus"
      - "weighted_consensus"
      - "confidence_weighted"
    required_agreement: 2  # At least 2 out of 3 algorithms must agree

# MCP Integration
mcp_integration:
  # Bridge Configuration
  bridge_enabled: true
  bridge_timeout: 30
  bridge_retries: 3
  
  # Service Mappings
  service_mappings:
    market_data: "arbitrage_services"
    risk_analysis: "risk_management"
    gas_optimization: "enhanced_manager"
    execution_simulation: "flash_loan_services"
    context_storage: "supermemory"
    documentation: "context7"
    file_operations: "filesystem"
    
  # Agent Capabilities
  agent_capabilities:
    arbitragecoordinator: ["market_data", "execution_simulation", "context_storage"]
    marketanalyst: ["market_data", "documentation", "context_storage"]
    riskanalyst: ["risk_analysis", "context_storage", "file_operations"]
    executionspecialist: ["execution_simulation", "gas_optimization", "context_storage"]
    gasoptimizer: ["gas_optimization", "market_data", "context_storage"]
    compliancevalidator: ["documentation", "file_operations", "context_storage"]
    timinganalyst: ["market_data", "context_storage"]
    bridgespecialist: ["market_data", "documentation", "context_storage"]

# Performance and Monitoring
performance:
  # Metrics Collection
  metrics_enabled: true
  metrics_retention_hours: 24
  detailed_logging: true
  
  # Performance Thresholds
  thresholds:
    max_session_duration: 300  # 5 minutes
    max_conversation_rounds: 15
    min_consensus_confidence: 0.6
    max_response_time: 30  # seconds
    
  # Circuit Breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60  # seconds
    
  # Rate Limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_limit: 10

# Agent Registry Configuration
agent_registry:
  # Lifecycle Management
  max_agents_per_session: 10
  agent_timeout_minutes: 30
  cleanup_interval_seconds: 300  # 5 minutes
  
  # Performance Tracking
  track_performance: true
  performance_history_limit: 100
  
  # Agent Reuse
  enable_agent_reuse: true
  reuse_timeout_minutes: 15
  max_reuse_count: 5

# Error Handling and Recovery
error_handling:
  # Retry Configuration
  max_retries: 3
  retry_delay_seconds: 5
  exponential_backoff: true
  
  # Fallback Strategies
  fallback_enabled: true
  fallback_timeout: 60
  
  # Error Recovery
  auto_recovery: true
  recovery_strategies:
    - "restart_conversation"
    - "reduce_participants"
    - "simplify_consensus"
    - "manual_intervention"

# Security Configuration
security:
  # Agent Security
  validate_agents: true
  agent_sandboxing: true
  
  # Communication Security
  encrypt_communications: false  # Set to true in production
  validate_messages: true
  
  # Access Control
  role_based_access: true
  capability_restrictions: true

# Development and Testing
development:
  # Mock Configuration
  mock_mode: false
  mock_responses: false
  
  # Testing
  test_agents: false
  simulation_mode: false
  
  # Debug Features
  debug_conversations: true
  save_conversation_logs: true
  detailed_error_logging: true

# Production Overrides
production:
  system:
    debug: false
    log_level: "WARNING"
    
  security:
    encrypt_communications: true
    agent_sandboxing: true
    
  performance:
    circuit_breaker:
      failure_threshold: 3
      
    rate_limiting:
      requests_per_minute: 120
      
  error_handling:
    auto_recovery: true
    max_retries: 2