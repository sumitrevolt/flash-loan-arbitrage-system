services:
  orchestrator:
    build:
      context: .
      dockerfile: containers/orchestrator/Dockerfile.github-enhanced
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - COPILOT_API_KEY=${COPILOT_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./containers/orchestrator:/app
      - ./scripts:/scripts
    depends_on:
      - redis-cluster
      - postgres-db

  mcp-servers:
    build:
      context: .
      dockerfile: containers/mcp_servers/Dockerfile.copilot-enhanced
    environment:
      - SERVER_TYPE=flash_loan
      - SERVER_ID=01
      - REDIS_URL=redis://redis-cluster:6379
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    ports:
      - "8000-8030:8000-8030"
    volumes:
      - ./containers/mcp_servers:/app/mcp_servers
    depends_on:
      - redis-cluster
      - postgres-db

  redis-cluster:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - mcp-servers
      - orchestrator

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  postgres-data:
  grafana-data: